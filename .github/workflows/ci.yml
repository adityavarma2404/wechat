name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Validate dependency tree
        run: npm ls --all

      - name: Run ESLint
        run: npm run lint

      - name: Check types and build production app
        run: npm run build

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Audit production and development dependencies
        id: security-audit
        continue-on-error: true
        run: npm audit --package-lock-only --include=dev --audit-level=low

      - name: Report advisory audit failure
        if: ${{ steps.security-audit.outcome == 'failure' }}
        run: |
          echo "::warning::Dependency audit failed. Review the audit logs for vulnerabilities or registry errors. This check is advisory."
          echo "### Dependency security audit" >> "$GITHUB_STEP_SUMMARY"
          echo "The audit reported vulnerabilities or could not complete. Review the audit step logs. This result does not block merging." >> "$GITHUB_STEP_SUMMARY"
